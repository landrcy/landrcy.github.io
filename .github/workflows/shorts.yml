name: shorts-stats
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: shorts, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      # GitHub only fires the */10 cron every few hours, so loop inside one job (~5.5h) to get real 10-min snapshots
      - run: |
          git config user.name shorts-bot; git config user.email shorts-bot@users.noreply.github.com
          end=$(( $(date +%s) + 19800 ))
          while [ $(date +%s) -lt $end ]; do
            # always start from a clean origin/main so a manual commit to shorts.json can't wedge the loop in a failed rebase
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/shorts.py || true
            git add youtube/shorts.json
            if ! git diff --cached --quiet; then
              git commit -qm "shorts stats"
              git push -q || { cp youtube/shorts.json /tmp/s.json; git fetch -q origin main; git reset -q --hard origin/main; cp /tmp/s.json youtube/shorts.json; git add youtube/shorts.json; git commit -qm "shorts stats"; git push -q || true; }
            fi
            sleep 540
          done
