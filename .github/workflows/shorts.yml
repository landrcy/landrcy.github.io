name: shorts-stats
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: shorts, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp && python3 scripts/shorts.py
      - run: |
          git config user.name shorts-bot; git config user.email shorts-bot@users.noreply.github.com
          git add youtube/shorts.json
          git diff --cached --quiet || (git commit -m "shorts stats [skip ci]" && git pull --rebase -q && git push)
