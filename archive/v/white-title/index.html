<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicons/llc-infinity-16.png" type="image/png" sizes="16x16"><link rel="icon" href="favicons/llc-infinity-32.png" type="image/png" sizes="32x32"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="favicons/llc-infinity-180.png"><title>LLC</title><meta name="description" content="Games and websites by Landry.">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fff;color:#1a1a22}
.hero{min-height:100vh;display:grid;place-items:center;padding:0;overflow:hidden}
.hero>div{width:100%}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1.logo.llc5{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:0;width:100%}
h1.logo.llc5 canvas{display:block;max-width:100vw;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#fff}
h1.logo.llc5.playing canvas{cursor:pointer}
.llc5-skip{font:400 .72rem Silkscreen,monospace;letter-spacing:.06em;color:#8a8fa0;background:none;border:1px solid #dde0e8;padding:.35rem .7rem;cursor:pointer;min-height:1.9rem;transition:opacity .6s}
.llc5-skip.off{opacity:0;pointer-events:none;visibility:hidden}
.side{position:fixed;right:1.2rem;bottom:1.1rem;font:400 .7rem Silkscreen,monospace;letter-spacing:.08em;color:#9aa0b0;text-decoration:none}
.side:hover,.side:focus-visible{color:#333}
@media(prefers-reduced-motion:reduce){.llc5-skip{display:none}*{transition:none!important}}
</style></head><body>
<main id="top"><header class="hero"><div>
<h1 class="logo llc5"><span class="sr">LLC</span>
<canvas data-white id="llc5c" width="320" height="180" aria-hidden="true"></canvas><noscript><img src="llc-title/final.png" alt="" width="640" style="image-rendering:pixelated"></noscript>
<button type="button" class="llc5-skip off" id="llc5skip" aria-label="Skip the title animation">click or press any key to skip</button></h1>
</div></header></main>
<a class="side" href="archive/">archive →</a>
<script src="llc-title/llc-title.js" defer></script>
</body></html>
