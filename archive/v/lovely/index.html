<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landry's Lovely Creations LLC</title><meta name="description" content="A hub for all of Landry's lovely creations.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f1;--fg:#2a1f3d;--muted:#6b5e80;--card:#fff;--line:#f0e2d6;--a1:#ff5d8f;--a2:#ffb347;--a3:#6c63ff}
@media(prefers-color-scheme:dark){:root{--bg:#14101f;--fg:#f4eefe;--muted:#b3a8c9;--card:#1f1930;--line:#2e2645}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:5rem 1.25rem 3rem;position:relative;overflow:hidden}
header::before,header::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:-1}
header::before{width:340px;height:340px;background:var(--a1);top:-80px;left:10%}header::after{width:300px;height:300px;background:var(--a3);top:20px;right:8%}
h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(2.4rem,7vw,5rem);line-height:1.05;margin:0;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
h1 .llc{display:inline-block;transform:rotate(-6deg);font-size:.45em;vertical-align:middle;padding:.1em .4em;border:3px solid var(--a2);border-radius:.4em;color:var(--a2);-webkit-text-fill-color:var(--a2)}
@keyframes shine{to{background-position:300% center}}
.tag{font-size:1.2rem;color:var(--muted);margin-top:1rem}
main{flex:1;width:100%;max-width:1150px;margin:0 auto;padding:1rem 1.25rem 4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.3,1.6,.6,1),box-shadow .25s;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 18px 40px rgba(108,99,255,.25)}
.thumb{aspect-ratio:16/10;overflow:hidden;background:#000}.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .thumb img{transform:scale(1.06)}
.body{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.body h2{font-family:Fredoka,sans-serif;margin:0;font-size:1.4rem}.body p{margin:0;color:var(--muted);flex:1}
.btn{align-self:flex-start;margin-top:.6rem;text-decoration:none;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a3));padding:.55rem 1.2rem;border-radius:999px;transition:transform .2s}
.btn:hover,.btn:focus-visible{transform:scale(1.07)}
footer{text-align:center;padding:2rem;color:var(--muted);border-top:1px solid var(--line);font-size:.9rem}footer a{color:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>Landry's Lovely Creations <span class="llc">LLC</span></h1><p class="tag">Games, gizmos &amp; delightful things on the web ✨</p></header>
<main><section class="grid">
<article class="card"><a class="thumb" href="https://landrcy.github.io/binding-of-ashaad/"><img src="thumbs/binding-of-ashaad.png" alt="Screenshot of The Binding of Ashaad title screen" loading="lazy"></a>
<div class="body"><h2>The Binding of Ashaad</h2><p>A brainrot roguelike you can play right in your browser.</p><a class="btn" href="https://landrcy.github.io/binding-of-ashaad/">Visit →</a></div></article>
</section></main>
<footer>© <span id="y">2026</span> Landry's Lovely Creations LLC · <a href="https://github.com/landrcy">github.com/landrcy</a></footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body></html>
