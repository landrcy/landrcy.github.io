<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../favicons/sun-L-32.png" type="image/png" sizes="32x32"><link rel="icon" href="../favicons/sun-L.ico" sizes="any"><link rel="apple-touch-icon" href="../favicons/sun-L-180.png">
<title>Laverse Cards</title><meta name="description" content="Laverse as a deck of cards: open the golden box, shuffle, and draw one of Landry's sites.">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css?v=1"></head><body>
<a id="back" href="/shelf/" aria-label="Back to the shelf"><svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 1h1v1H3zM2 2h1v1H2zM1 3h1v1H1zM0 4h8v1H0zM1 5h1v1H1zM2 6h1v1H2zM3 7h1v1H3z"/></svg></a>
<main id="table">
 <img id="floor" class="px" src="img/floor.png" alt="">
 <div id="deck" aria-hidden="true"></div>
 <button id="box" type="button" aria-label="Open the golden card box">
  <img class="px rays" src="img/rays.png" alt="">
  <div class="pet top"><img class="px pfr" src="img/pf_t.png" alt=""><img class="px pbk" src="img/pb_t.png" alt=""></div>
  <div class="pet right"><img class="px pfr" src="img/pf_r.png" alt=""><img class="px pbk" src="img/pb_r.png" alt=""></div>
  <div class="pet bottom"><img class="px pfr" src="img/pf_b.png" alt=""><img class="px pbk" src="img/pb_b.png" alt=""></div>
  <div class="pet left"><img class="px pfr" src="img/pf_l.png" alt=""><img class="px pbk" src="img/pb_l.png" alt=""></div>
  <img class="px medal" src="img/medal.png" alt="">
  <canvas class="px glint" width="116" height="160"></canvas>
 </button>
 <button id="deckhit" type="button" aria-label="Shuffle and draw a card" hidden></button>
</main>
<button id="shuffle" class="b" type="button" hidden>Shuffle</button>
<div id="shade" hidden></div>
<div id="big"></div>
<div id="acts" hidden><a id="go" class="b go" href="#">Go to</a><button id="again" class="b" type="button">Draw again</button></div>
<div id="fx" aria-hidden="true"></div>
<p id="live" class="sr" aria-live="polite"></p>
<nav class="sr" aria-label="Sites" id="sites"></nav>
<script src="cards.js?v=1"></script>
</body></html>
