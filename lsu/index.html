<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lsu</title><meta name="description" content="Lsu: a minimalist rhythm game. Aim, click, phonk.">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0a0a0d;color:#f2f2f5;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;cursor:none;user-select:none}
canvas{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}.scr.off{opacity:0;pointer-events:none}
#menu .cookie{width:min(260px,52vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:min(96px,19vw);letter-spacing:-4px;background:radial-gradient(circle at 50% 40%,#ff3d7f,#c4185a 70%);box-shadow:0 0 0 8px #fff,0 0 80px rgba(255,61,127,.35);transition:transform .08s}
#menu .hint{margin-top:44px;font-size:13px;letter-spacing:6px;opacity:.5;text-transform:uppercase}
#sel{align-items:stretch;justify-content:center;padding:0 8vw}
#sel h2{font-weight:300;letter-spacing:10px;font-size:13px;opacity:.5;margin:0 0 18px;text-transform:uppercase}
.song{display:flex;align-items:center;gap:20px;padding:18px 22px;margin:6px 0;border-left:3px solid transparent;background:rgba(255,255,255,.03);transition:.15s;transform-origin:left}
.song.on{border-color:#ff3d7f;background:rgba(255,61,127,.08);transform:translateX(14px)}.song b{font-size:22px;font-weight:700;flex:1}.song small{opacity:.55;font-size:13px;letter-spacing:1px}
.diffs{display:flex;gap:8px;margin-top:22px}.diff{padding:10px 18px;border:1px solid rgba(255,255,255,.18);font-size:13px;letter-spacing:3px;text-transform:uppercase}.diff.on{border-color:#fff;background:#fff;color:#000}
.stars{color:#ffcf4a;letter-spacing:2px}.go{margin-top:26px;font-size:13px;letter-spacing:6px;opacity:.55;text-transform:uppercase}
#res .grade{font-size:min(200px,34vw);font-weight:900;line-height:1;letter-spacing:-8px}
#res .stat{display:grid;grid-template-columns:repeat(4,auto);gap:6px 34px;margin:20px 0;font-size:15px;text-align:center}#res .stat i{display:block;font-style:normal;opacity:.45;font-size:11px;letter-spacing:3px}
#res .big{font-size:40px;font-weight:200;letter-spacing:2px}.btns{display:flex;gap:12px;margin-top:20px}.btn{padding:12px 26px;border:1px solid rgba(255,255,255,.25);font-size:13px;letter-spacing:4px;text-transform:uppercase}.btn:hover{background:#fff;color:#000}
#pause{background:rgba(5,5,8,.82)}#pause .btn{width:220px;text-align:center;margin:6px}
#hud{position:fixed;inset:0;pointer-events:none}#score{position:absolute;top:14px;right:22px;font:300 34px ui-monospace,Menlo,monospace;letter-spacing:2px}#acc{position:absolute;top:56px;right:22px;font:14px ui-monospace,Menlo,monospace;opacity:.7}
#combo{position:absolute;left:22px;bottom:16px;font-weight:800;font-size:48px;transform-origin:left bottom}#hp{position:absolute;top:0;left:0;height:5px;background:#fff;width:50%;transition:width .12s}
#prog{position:absolute;top:22px;right:236px;width:22px;height:22px;border-radius:50%}
#back{position:fixed;left:16px;top:14px;font-size:12px;letter-spacing:4px;opacity:.4;text-transform:uppercase;color:#fff;text-decoration:none;cursor:none;z-index:5}
</style></head><body>
<canvas id="c"></canvas>
<a id="back" href="/">&#8592; laverse</a>
<div id="menu" class="scr"><div class="cookie" id="cookie">Lsu</div><div class="hint">click to play</div></div>
<div id="sel" class="scr off"><h2>select</h2><div id="songs"></div><div class="diffs" id="diffs"></div><div class="go">enter / click the song again &middot; z x or click to hit &middot; esc pause</div></div>
<div id="hud" class="off scr" style="display:block"><div id="hp"></div><svg id="prog" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"/><circle id="pc" cx="11" cy="11" r="9" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)"/></svg><div id="score">00000000</div><div id="acc">100.00%</div><div id="combo"></div></div>
<div id="pause" class="scr off"><div class="btn" data-a="cont">continue</div><div class="btn" data-a="retry">retry</div><div class="btn" data-a="quit">quit</div></div>
<div id="res" class="scr off"><div class="grade" id="grade">S</div><div class="big" id="rscore"></div><div class="stat" id="rstat"></div><div class="btns"><div class="btn" data-a="retry">retry</div><div class="btn" data-a="quit">back</div></div></div>
<script src="lsu.js"></script></body></html>
