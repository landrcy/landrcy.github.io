<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lsu</title><meta name="description" content="Lsu: a minimalist rhythm game. Aim, click, phonk.">
<meta name="theme-color" content="#0a0a0d">
<style>
:root{--pk:#ff3d7f;--pk2:#ff7fb0;--glow:0 0 10px rgba(255,61,127,.55),0 0 26px rgba(255,61,127,.28);--glow2:0 0 14px rgba(255,61,127,.9),0 0 40px rgba(255,61,127,.55),0 0 80px rgba(255,61,127,.25)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0a0a0d;color:#f2f2f5;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}.scr.off{opacity:0;pointer-events:none}
/* menu cookie */
#menu .cookie{width:min(260px,52vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:min(96px,19vw);letter-spacing:-4px;background:radial-gradient(circle at 50% 38%,#ff6d9f,#ff3d7f 45%,#c4185a 75%);box-shadow:0 0 0 8px #fff,0 0 0 9px rgba(255,61,127,.9),0 0 34px rgba(255,61,127,.8);text-shadow:0 0 18px rgba(255,255,255,.65),0 2px 0 rgba(0,0,0,.15)}
#menu .cookie:hover{box-shadow:0 0 0 8px #fff,0 0 0 10px #ff7fb0,0 0 48px rgba(255,61,127,1)}
#menu .cookie:active{filter:brightness(1.15)}
#menu .hint{margin-top:44px;font-size:13px;letter-spacing:6px;opacity:.6;text-transform:uppercase;text-shadow:0 0 12px rgba(255,61,127,.7)}
#menu .sub{margin-top:10px;font-size:11px;letter-spacing:4px;opacity:.35;text-transform:uppercase}
/* select */
#sel{align-items:stretch;justify-content:center;padding:0 max(5vw,14px)}
#selin{width:min(760px,100%);margin:0 auto;max-height:100%;overflow:auto;padding:54px 0 20px;scrollbar-width:none;touch-action:pan-y}#selin::-webkit-scrollbar{display:none}
#sel h2{font-weight:300;letter-spacing:10px;font-size:13px;opacity:.6;margin:0 0 14px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,61,127,.6)}
.song{display:flex;align-items:center;gap:16px;padding:10px 16px 10px 10px;margin:8px 0;border-left:3px solid transparent;background:rgba(255,255,255,.035);transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;transform-origin:left;box-shadow:0 0 0 1px rgba(255,61,127,.12),0 0 14px rgba(255,61,127,.08);border-radius:2px}
.song:hover{background:rgba(255,61,127,.06);box-shadow:0 0 0 1px rgba(255,61,127,.35),0 0 18px rgba(255,61,127,.25)}
.song.on{border-color:var(--pk);background:rgba(255,61,127,.1);transform:translateX(12px);box-shadow:0 0 0 1px rgba(255,61,127,.7),var(--glow2)}
.song canvas.cov{position:static;width:64px;height:64px;flex:none;border-radius:2px;box-shadow:0 0 12px rgba(255,61,127,.35)}
.song .meta{flex:1;min-width:0}.song b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song.on b{text-shadow:0 0 14px rgba(255,61,127,.8)}
.song small{display:block;opacity:.6;font-size:12px;letter-spacing:1px;margin-top:3px}.song .lic{opacity:.38;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.song .ld{font-size:10px;letter-spacing:3px;opacity:.7;color:var(--pk2)}
.diffs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.diff{padding:10px 16px;border:1px solid rgba(255,61,127,.45);font-size:12px;letter-spacing:3px;text-transform:uppercase;box-shadow:var(--glow);transition:.15s;text-shadow:0 0 8px rgba(255,61,127,.6)}
.diff:hover{box-shadow:var(--glow2);border-color:var(--pk2)}.diff.on{border-color:#fff;background:#fff;color:#000;text-shadow:none;box-shadow:0 0 0 1px #fff,var(--glow2)}.diff:active{transform:scale(.96)}
.diff i{font-style:normal;opacity:.6;letter-spacing:1px;margin-left:6px;font-size:11px}
.stars{color:#ffcf4a;letter-spacing:1px;text-shadow:0 0 8px rgba(255,207,74,.7)}.diff.on .stars{color:#c48a00;text-shadow:none}
.row{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.go{font-size:12px;letter-spacing:5px;opacity:.55;text-transform:uppercase}
.play{padding:12px 30px;background:var(--pk);color:#fff;font-weight:800;letter-spacing:6px;font-size:14px;text-transform:uppercase;box-shadow:0 0 0 2px #fff,var(--glow2);text-shadow:0 0 10px rgba(255,255,255,.7);transition:.12s}
.play:hover{box-shadow:0 0 0 2px #fff,0 0 22px rgba(255,61,127,1),0 0 60px rgba(255,61,127,.7),0 0 120px rgba(255,61,127,.35);filter:brightness(1.1)}.play:active{transform:scale(.96)}
.lnk{font-size:11px;letter-spacing:4px;opacity:.6;text-transform:uppercase;padding:8px 12px;border:1px solid rgba(255,255,255,.18);box-shadow:var(--glow);transition:.15s}.lnk:hover{opacity:1;box-shadow:var(--glow2)}
/* results */
#res .grade{font-size:min(190px,30vw);font-weight:900;line-height:1;letter-spacing:-8px;text-shadow:0 0 30px currentColor,0 0 80px currentColor}
#res .big{font-size:40px;font-weight:200;letter-spacing:2px;text-shadow:0 0 16px rgba(255,61,127,.6)}
#res .stat{display:grid;grid-template-columns:repeat(4,auto);gap:8px 30px;margin:16px 0 8px;font-size:15px;text-align:center}#res .stat i{display:block;font-style:normal;opacity:.45;font-size:11px;letter-spacing:3px}
#res .song2{opacity:.55;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
#errc{width:min(440px,86vw);height:70px;position:static;margin-top:6px}
#res .elab{font-size:10px;letter-spacing:3px;opacity:.45;text-transform:uppercase}
.btns{display:flex;gap:12px;margin-top:18px}.btn{padding:12px 26px;border:1px solid rgba(255,61,127,.6);font-size:13px;letter-spacing:4px;text-transform:uppercase;box-shadow:var(--glow);text-shadow:0 0 8px rgba(255,61,127,.7);transition:.12s}
.btn:hover{background:#fff;color:#000;text-shadow:none;box-shadow:0 0 0 1px #fff,var(--glow2)}.btn:active{transform:scale(.96)}
#pause{background:rgba(5,5,8,.82)}#pause .btn{width:220px;text-align:center;margin:6px}
#cred{background:rgba(5,5,8,.9);padding:20px}#cred .box{width:min(560px,100%);font-size:13px;line-height:1.6}#cred h3{font-weight:300;letter-spacing:8px;font-size:13px;text-transform:uppercase;opacity:.7}#cred a{color:var(--pk2);text-decoration:none;cursor:none}#cred p{margin:8px 0;opacity:.85}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}#score{position:absolute;top:14px;right:22px;font:300 34px ui-monospace,Menlo,monospace;letter-spacing:2px;text-shadow:0 0 14px rgba(255,61,127,.6)}#acc{position:absolute;top:56px;right:22px;font:14px ui-monospace,Menlo,monospace;opacity:.75}
#combo{position:absolute;left:22px;bottom:16px;font-weight:800;font-size:48px;transform-origin:left bottom;text-shadow:0 0 16px rgba(255,61,127,.75)}
#hpw{position:absolute;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.06)}#hp{height:100%;background:#fff;width:50%;box-shadow:0 0 10px #ff3d7f,0 0 20px rgba(255,61,127,.6);transition:width .12s}
#prog{position:absolute;top:22px;right:236px;width:22px;height:22px;border-radius:50%;filter:drop-shadow(0 0 4px rgba(255,61,127,.8))}
#tleft{position:absolute;top:26px;right:266px;font:12px ui-monospace,Menlo,monospace;opacity:.55}
#kiai{position:absolute;top:84px;right:22px;font-size:10px;letter-spacing:5px;color:var(--pk2);opacity:0;text-shadow:0 0 10px var(--pk);transition:opacity .2s}
#back{position:fixed;left:16px;top:14px;font-size:12px;letter-spacing:4px;opacity:.5;text-transform:uppercase;color:#fff;text-decoration:none;cursor:none;z-index:5;text-shadow:0 0 10px rgba(255,61,127,.8)}
#back:hover{opacity:1}
body.playing #back{display:none}
@media (max-width:600px){#score{font-size:24px;top:12px;right:14px}#acc{top:42px;right:14px;font-size:12px}#prog{right:auto;left:14px;top:14px}#tleft{right:auto;left:42px;top:18px}#combo{font-size:36px;left:14px}#kiai{top:62px;right:14px}#res .stat{grid-template-columns:repeat(2,auto)}.song b{font-size:16px}.song canvas.cov{width:52px;height:52px}.song.on{transform:translateX(6px)}#res .big{font-size:30px}}
@media (prefers-reduced-motion:reduce){.scr{transition:none}.song,.diff,.btn,.play{transition:none}.song.on{transform:none}}
</style></head><body>
<canvas id="c"></canvas>
<a id="back" href="/">&#8592; laverse</a>
<div id="menu" class="scr"><div class="cookie" id="cookie">Lsu</div><div class="hint" id="hint">click to play</div><div class="sub">aim &middot; click &middot; phonk</div></div>
<div id="sel" class="scr off"><div id="selin"><h2>select</h2><div id="songs"></div><div class="diffs" id="diffs"></div><div class="row"><div class="play" id="playb">play</div><div class="lnk" id="credb">credits</div><div class="go">z x / click to hit &middot; esc pause</div></div></div></div>
<div id="hud" class="off scr" style="display:block"><div id="hpw"><div id="hp"></div></div><svg id="prog" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"/><circle id="pc" cx="11" cy="11" r="9" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)"/></svg><div id="tleft"></div><div id="score">00000000</div><div id="acc">100.00%</div><div id="kiai">kiai</div><div id="combo"></div></div>
<div id="pause" class="scr off"><div class="btn" data-a="cont">continue</div><div class="btn" data-a="retry">retry</div><div class="btn" data-a="quit">quit</div></div>
<div id="cred" class="scr off"><div class="box" id="credbox"></div><div class="btns"><div class="btn" data-a="credx">close</div></div></div>
<div id="res" class="scr off"><div class="grade" id="grade">S</div><div class="big" id="rscore"></div><div class="song2" id="rsong"></div><div class="stat" id="rstat"></div><canvas id="errc"></canvas><div class="elab" id="elab"></div><div class="btns"><div class="btn" data-a="retry">retry</div><div class="btn" data-a="quit">back</div></div></div>
<script src="lsu.js?v=2"></script></body></html>
